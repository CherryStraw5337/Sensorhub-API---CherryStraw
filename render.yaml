# render.yaml (infraestructura como codigo)
services:
  - type: web
    name: Sensorhub API
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: Sensorhub Database, property: connectionString }
databases:
  - name: Sensorhub Database
    plan: free