[tool.pytest.ini_options]
# Pytest solo debe contener los argumentos de configuración propios de pytest. Para cambiar la ruta, solo modifica --cov
# con "--cov={carpeta/archivo que quieres testear}"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "migrations",  # Excluye las migraciones de Alembic
    "alembic",     # Excluye la carpeta duplicada si existe
    ".venv",
]

[tool.ruff.lint]
# E: Errores de estilo, F: Errores lógicos, I: Orden de imports, UP: Sintaxis moderna, B: Bugs comunes (flake8-bugbear)
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "alembic/", "venv/", ".venv/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]