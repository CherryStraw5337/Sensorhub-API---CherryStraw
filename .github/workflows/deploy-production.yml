name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Desencadenando despliegue en Render..."
            curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL no esta configurado en los secretos de GitHub. Saltando este paso de forma segura."
          fi